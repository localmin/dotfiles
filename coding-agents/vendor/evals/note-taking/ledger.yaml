convergence:
  status: accuracy-converged-with-residual
  rationale: |
    NOT converged under the strict criterion (two consecutive iterations with
    zero unclear points). Recorded as-is rather than rounded up.

    Accuracy: 100% in every iteration, 32/32 trials (2 tasks x 2 trials x 8
    iterations). No grader ever failed; every regex and llm rubric passed,
    including the ones asserting inkdrop://note/<id> links, filename+line
    code-fence attributes, absence of commit=/url= on uncommitted code,
    refusal of [[wiki-link]] syntax, and refusal of a backtick inside a
    code-fence title.

    Unclear points per iteration: iters 1-3 = 4,4,4; iters 4-8 = 0,2,1,0,4.
    Every unclear point is scenario-derived, never skill-derived: they restate
    "the scenario asked for something the skill forbids, so I substituted and
    disclosed it" and "no note id was available, so I used a placeholder".
    Both are properties of the edge task, which deliberately embeds a conflict
    with the skill in order to test whether the skill wins. None was ever
    re-seen (reseen_count is 0 in all 8 iterations), i.e. the executor phrases
    the same two observations differently each run rather than surfacing new
    gaps. Removing the conflict from the scenario would drive unclear to zero
    but would also remove what the edge task exists to test.

    Two setup defects were found and fixed mid-gate; iters 1-3 are superseded:
      - config.model was claude-sonnet-4-6, which does not exist in this
        environment. The claude CLI does NOT reject an unknown model id: it
        passes the string through and echoes it back in modelUsage, so the run
        completes and its provenance is unverifiable. Iters 4+ use
        claude-sonnet-5. The test-driven-development gate names the same
        invalid id and has the same provenance problem in its record.
      - the edge task did not say how to resolve the conflict it embedded,
        which manufactured unclear points. Iters 4+ pre-authorize substitution
        in the prompt.

    Adopted at inkdropapp/skills@067b7796649fcd56c0023eb2b5dfee68e984fcbd.
    Upstream ships no LICENSE file (its README says so); the payload is
    gitignored and not redistributed, same handling as ast-grep/agent-skill.
