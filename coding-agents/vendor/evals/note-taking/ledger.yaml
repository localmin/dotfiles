eval: note-taking-adoption-gate
skill: skills/note-taking
patterns:
  - rule: >-
      When a scenario's stated requirement contradicts a skill's explicit
      constraint, the skill's constraint wins. Apply the correct mechanism and
      document the substitution.
    seen_in:
      - 1
    representative_issue: >-
      The scenario requested wiki-link syntax (`[[Session store]]`, `[[Token
      refresh]]`) for cross-referencing notes.
  - rule: >-
      When a scenario requests a code-fence attribute value that the skill
      explicitly prohibits, substitute the closest valid form and note the
      reason.
    seen_in:
      - 1
    representative_issue: >-
      The scenario requested `title="\`useAuthRetry\`"` (backtick-wrapped hook
      name inside a title attribute).
  - rule: >-
      When a scenario requirement directly contradicts a skill constraint, the
      skill constraint wins; rephrase or substitute to comply with the skill,
      and surface the conflict to the caller.
    seen_in:
      - 1
    representative_issue: >-
      The scenario asked for wiki-links (`[[Session store]]`, `[[Token
      refresh]]`).
  - rule: >-
      When a scenario specifies an attribute value that the skill prohibits for
      syntactic reasons, apply the skill's prescribed rephrasing and note the
      substitution.
    seen_in:
      - 1
    representative_issue: >-
      The scenario asked for title="`useAuthRetry`" (backtick inside the title
      value).
  - rule: >-
      When a scenario's stated requirement conflicts with an explicit
      prohibition in the governing skill, follow the skill rule and document the
      deviation — do not silently implement the prohibited form.
    seen_in:
      - 2
    representative_issue: >-
      The scenario requested wiki-link syntax (`[[Session store]]`, `[[Token
      refresh]]`) for cross-referencing notes.
  - rule: >-
      When a scenario specifies a literal attribute value that the skill marks
      as invalid, substitute a skill-compliant equivalent (rephrase without the
      prohibited character) and note the substitution.
    seen_in:
      - 2
    representative_issue: >-
      The scenario requested `title="\`useAuthRetry\`"` (backtick-wrapped hook
      name in the title attribute).
  - rule: >-
      When a scenario requirement directly contradicts a skill-level constraint,
      follow the skill and substitute the compliant form, reporting the
      substitution.
    seen_in:
      - 2
    representative_issue: >-
      Scenario required wiki-link syntax `[[Session store]]` / `[[Token
      refresh]]`.
  - rule: >-
      When a scenario requests a construct the skill forbids with an explicit
      workaround, apply the workaround and document the change.
    seen_in:
      - 2
    representative_issue: >-
      Scenario required `title="`useAuthRetry`"` (backtick inside the title
      attribute).
  - rule: >-
      When a scenario's stated requirement conflicts with the skill's documented
      constraint, the skill's rule takes precedence; document the deviation
      rather than silently complying with the conflicting request.
    seen_in:
      - 3
    representative_issue: >-
      The scenario requested `[[Session store]]` and `[[Token refresh]]`
      wiki-link syntax.
  - rule: >-
      When the scenario specifies a syntactically invalid attribute value that
      the skill forbids, apply the skill's prescribed rephrasing rule and note
      the substitution.
    seen_in:
      - 3
    representative_issue: >-
      The scenario requested `title="\`useAuthRetry\`"` (backticks inside the
      title value).
  - rule: >-
      When scenario requirements conflict with explicit skill constraints,
      follow the skill and surface the conflict in the output rather than
      silently complying with the scenario.
    seen_in:
      - 3
    representative_issue: >-
      The scenario requests wiki-links (`[[Session store]]`, `[[Token
      refresh]]`) and a backtick-containing title (`title="`useAuthRetry`"`).
  - rule: >-
      When a skill step requires a tool that is unavailable, use a
      clearly-labelled placeholder and instruct the user how to resolve it.
    seen_in:
      - 3
    representative_issue: >-
      No MCP server is available, so real note IDs for "Session store" and
      "Token refresh" cannot be resolved.
  - rule: >-
      When a scenario's literal request violates a documented tool/format
      constraint, follow the constraint and state the substitution explicitly
      rather than attempting a literal but broken rendering.
    seen_in:
      - 5
    representative_issue: >-
      The scenario says the code block should be "titled with the hook name in
      backticks, i.e. title="`useAuthRetry`"", but the skill states a title
      value cannot contain a backtick.
  - rule: >-
      When required identifiers are unavailable and the instructions permit a
      placeholder, use an unambiguous, clearly-labeled placeholder token rather
      than fabricating a plausible-looking id.
    seen_in:
      - 5
    representative_issue: No note ids were available for the wiki-link targets.
  - rule: >-
      When a skill explicitly documents a hard constraint that conflicts with a
      stated user requirement, and the user has pre-authorized silent
      substitution, apply the skill's documented workaround directly and
      disclose the substitution inline — don't re-litigate it as a question.
    seen_in:
      - 6
    representative_issue: >-
      The scenario asked for `title="` `useAuthRetry` `"` (backticks inside a
      quoted title attribute), which the skill explicitly says breaks fence
      parsing.
  - rule: >-
      When a scenario explicitly names a syntax the reference doc says is
      unsupported, and pre-authorizes silent substitution, apply the doc's
      documented alternative directly rather than flagging it as a blocking
      question.
    seen_in:
      - 8
    representative_issue: >-
      Scenario asked for wiki-links `[[Session store]]` / `[[Token refresh]]`,
      which the skill explicitly says Inkdrop doesn't support.
  - rule: >-
      When a doc gives an explicit rephrasing example for a known-broken syntax,
      mirror that example's pattern rather than inventing an unrelated
      substitution.
    seen_in:
      - 8
    representative_issue: >-
      Scenario asked for a code-block title containing backticks (``
      `useAuthRetry` ``), which the skill says breaks fence parsing.
  - rule: >-
      When a skill lacks a documented placeholder convention for a missing
      identifier, invent a clearly-marked, unambiguous placeholder (e.g.
      `<note-id>`) and state explicitly that it needs substitution, rather than
      guessing at an undocumented syntax.
    seen_in:
      - 8
    representative_issue: >-
      The scenario asked for wiki-links "like `[[Session store]]` and `[[Token
      refresh]]`" but skill says Inkdrop has no wiki-link syntax at all — only
      single specific note IDs via `inkdrop://note/<id>`, with no documented
      placeholder-id convention.
  - rule: >-
      When a scenario asks for an explanatory note body but omits the underlying
      bug/fix narrative, either flag the gap explicitly in the deliverable
      (e.g., mark inferred prose as inferred) or request the missing narrative
      before drafting factual-sounding explanation text.
    seen_in:
      - 8
    representative_issue: >-
      The skill's `commit`/`url` guidance couldn't be applied because the
      scenario states the code is on an uncommitted local branch, so I used
      `filename`+`line` per the skill's explicit preference rule for that case;
      the "fix" explanation itself (why debounce/loading-state matters) isn't
      given in the scenario, so I inferred plausible rationale from the code and
      title rather than from verified facts.
